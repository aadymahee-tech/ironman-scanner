name: Tests

# The scheduled scan (main.yml) invokes ironman_scanner.py. Until this workflow
# existed nothing checked that the scanner, the generator and the watchlist were
# even importable — a missing scanner file could sit in main undetected because
# the only thing that would have failed was a scheduled job whose job is to
# produce a report nobody had seen yet.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the test suite
        run: python -m unittest discover -s tests -t . -v

      - name: Validate the watchlist and the generated Pine file
        run: |
          python tools/build_indicator.py --check
          python tools/build_indicator.py
          if ! git diff --quiet -- indicators/; then
            echo "::error::indicators/ is stale - run 'python3 tools/build_indicator.py' and commit the result"
            git --no-pager diff --stat -- indicators/
            exit 1
          fi

      - name: Offline scanner smoke test
        run: |
          python ironman_scanner.py \
            --source fixture \
            --fixture tests/fixtures/engine.json \
            --watchlist tests/fixtures/watchlist.csv \
            --interval 15m --lookback 2 --low 1000 --high 10000 \
            --md /tmp/latest.md --quiet
          grep -q "BOX BREAKOUT" /tmp/latest.md
