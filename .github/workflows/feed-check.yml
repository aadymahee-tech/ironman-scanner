name: Live feed check

# The scan itself (main.yml) is scheduled, so a broken live feed would only be
# noticed on the next tick — and if the feed breaks, nothing gets committed and
# the failure mode is a silent gap in results/. This checks a handful of symbols
# against the live provider on every PR and on demand.
#
# It is deliberately REPORT-ONLY: the provider is an unofficial, rate-limited
# endpoint, and a flaky third-party host must never block a merge. Treat the
# output as a signal, not a gate. The hard guard lives in main.yml, which exits
# non-zero when every fetch fails.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe the live provider (informational)
        run: |
          cat > /tmp/probe.csv <<'CSV'
          symbol,name,sector,approx_price,enabled
          NSE:INFY,Infosys,IT,1500,1
          NSE:HDFCBANK,HDFC Bank,Banking & Finance,1000,1
          NSE:HAL,Hindustan Aeronautics,Diversified & Infra,4200,1
          CSV

          {
            echo "### Live feed check"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          set +e
          python ironman_scanner.py \
            --source yahoo --watchlist /tmp/probe.csv \
            --interval 15m --lookback 1 \
            --low 0 --high 1000000 \
            --workers 3 --md - --verbose 2>&1 | tee /tmp/probe.log
          code=${PIPESTATUS[0]}
          set -e

          scanned=$(grep -oE 'scanned +: [0-9]+/[0-9]+ symbols' /tmp/probe.log | tail -1 || true)
          bars=$(grep -cE '· NSE:' /tmp/probe.log || true)
          failures=$(grep -cE '! NSE:' /tmp/probe.log || true)

          {
            echo '```'
            echo
            echo "${scanned:-scanner produced no summary}"
            echo "symbols returning bars: ${bars}   symbols failing: ${failures}"
          } >> "$GITHUB_STEP_SUMMARY"

          # One compact line of real engine output, parsed from the markdown the
          # scanner just produced: symbol, rating and regime. This is what makes
          # the check worth reading — it proves live bars flow through the whole
          # engine, not just that HTTP worked.
          engine_out=$(grep -E '^\| .*NSE:' /tmp/probe.log \
            | awk -F'|' '{gsub(/[* ]/,"",$2); gsub(/ /,"",$5); gsub(/ /,"",$6); gsub(/ /,"",$7); printf "%s=%s %s %s  ", $2, $5, $6, $7}' \
            | head -c 400 || true)

          # A single annotation line, so the outcome is visible in the checks UI
          # (and to automation) without opening the log.
          if [ "$code" -eq 0 ] && [ "${bars:-0}" -gt 0 ]; then
            echo "::notice title=Live feed check::${scanned}; ${bars} symbol(s) returned bars from the live provider. ${engine_out}"
          else
            echo "::warning title=Live feed check::exit ${code}, ${bars} symbol(s) returned bars, ${failures} failed. Not blocking: the endpoint is unofficial and rate-limited. If this persists, its response shape may have changed."
          fi

          # Report-only by design: never fail the build from a third-party host.
          exit 0
